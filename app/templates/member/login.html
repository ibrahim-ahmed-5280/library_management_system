<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Member Log In | Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
    <meta content="Coderthemes" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon"
        href="https://cdn.jsdelivr.net/gh/ibrahim-ahmed-5280/template-cdns/asset/images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/gh/ibrahim-ahmed-5280/template-cdns/asset/js/checking modes.js"
        rel="stylesheet" type="text/css" />
    <!-- App css -->
    <link href="https://cdn.jsdelivr.net/gh/ibrahim-ahmed-5280/template-cdns/asset/css/icons.min.css" rel="stylesheet"
        type="text/css" />
    <link href="https://cdn.jsdelivr.net/gh/ibrahim-ahmed-5280/template-cdns/asset/css/app.min.css" rel="stylesheet"
        type="text/css" id="light-style" />
    <link href="https://cdn.jsdelivr.net/gh/ibrahim-ahmed-5280/template-cdns/asset/css/app-dark.min.css"
        rel="stylesheet" type="text/css" id="dark-style" />

</head>

<body class="loading authentication-bg"
    data-layout-config='{"leftSideBarTheme":"default","layoutBoxed":false, "leftSidebarCondensed":false, "leftSidebarScrollable":false,"darkMode":false, "showRightSidebarOnStart": true}'>
    <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xxl-4 col-lg-5">
                    <div class="card">

                        <!-- Logo -->
                        <div class="card-header pt-4 pb-4 text-center bg-primary">
                            <a href="{{url_for('dashboard_member')}}">
                                <span><img
                                        src="./../../static/images/library-3.png"
                                        alt="" height="30"></span>
                            </a>
                        </div>

                        <div class="card-body p-4">

                            <div class="text-center w-75 m-auto">
                                <h4 class="text-dark-50 text-center pb-0 fw-bold">Sign In</h4>
                                <p class="text-muted mb-4">Enter your email address and password to access member panel.
                                </p>
                            </div>

                            <form id="login_member_form">
                                <div class="alert alert-danger mb-1" role="alert" id="error_msg" style="display: none;">
                                    A simple danger alert—check it out!
                                </div>

                                <div class="mb-3">
                                    <label for="emailaddress" class="form-label">Email address</label>
                                    <input class="form-control" type="email" id="emailaddress" required=""
                                        placeholder="Enter your email">
                                    <div id="email_error" class="error-message text-danger"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group input-group-merge">
                                        <input type="password" id="password" class="form-control"
                                            placeholder="Enter your password">
                                        <div class="input-group-text" data-password="false">
                                            <span class="password-eye"></span>
                                        </div>
                                    </div>
                                    <div id="pass_error" class="error-message text-danger"></div>
                                </div>

                                <div class="mb-3 mb-0 text-center">
                                    <button class="btn btn-primary" type="button" onclick="login()">
                                        <span id="spinner" class="spinner-border spinner-border-sm d-none" role="status"
                                            aria-hidden="true"></span>
                                        <span id="btnText">Log In</span>
                                    </button>
                                </div>
                            </form>
                        </div> <!-- end card-body -->
                    </div>
                    <!-- end card -->
                    <!-- end row -->

                </div> <!-- end col -->
            </div>
            <!-- end row -->
        </div>
        <!-- end container -->
    </div>
    <!-- end page -->

    <footer class="footer footer-alt">
        <script>document.write(new Date().getFullYear())</script> © Library Management Systems
    </footer>

    <!-- bundle -->
    <!-- bundle -->
    <script src="https://cdn.jsdelivr.net/gh/ibrahim-ahmed-5280/template-cdns/asset/js/vendor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ibrahim-ahmed-5280/template-cdns/asset/js/app.min.js"></script>

    <script src="{{url_for('static', filename = 'js/member/member_login.js')}}"></script>

</body>

</html>
