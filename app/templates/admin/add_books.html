{% extends "admin/admin_base.html" %}

{% block title %}Add Admins | LMS{% endblock %}

{% block content %}

<!-- start page title -->
<div class="row">
    <div class="col-12">
        <div class="page-title-box">
            <div class="page-title-right">
                <ol class="breadcrumb m-0">
                    <li class="breadcrumb-item"><a href="javascript: void(0);">LMS</a></li>
                    <li class="breadcrumb-item"><a href="javascript: void(0);">Add</a></li>
                    <li class="breadcrumb-item active">Books</li>
                </ol>
            </div>
            <h4 class="page-title">Registration Books , editions and their copies</h4>
        </div>
    </div>
</div>
<!-- end page title -->

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">


                <div class="alert alert-success" role="alert" id="succ_msg" style="display: none;">
                    A simple success alert—check it out!
                </div>
                <div class="alert alert-danger" role="alert" id="err_msg" style="display: none;">
                    A simple danger alert—check it out!
                </div>
                <form id="bookForm" novalidate>

                    <div class="alert alert-success" id="book_succ_msg" style="display:none;"></div>
                    <div class="alert alert-danger" id="book_error_msg" style="display:none;"></div>

                    <div class="row">

                        <!-- Book Title -->
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Book Title</label>
                                <input type="text" name="title_name" class="form-control"
                                    placeholder="Enter book title">
                                <div id="title_error" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Author -->
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Author Name</label>
                                <input type="text" name="author_name" class="form-control"
                                    placeholder="Enter author name">
                                <div id="author_error" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Category -->
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select name="category_id" class="form-control">
                                    <option value="">Select Category</option>
                                    {% for category in categories %}
                                    <option value="{{ category.category_id }}">{{ category.name }}</option>
                                    {% endfor %}
                                </select>
                                <div id="category_error" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3"
                                    placeholder="Book description"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-primary" onclick="add_book()">
                            <span id="bookSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            <span id="bookBtnText">Add Book</span>
                        </button>
                    </div>
                </form>



            </div>
        </div>
    </div>
</div>
</div>

<script src="{{url_for('static', filename = 'js/librarian/register_books_editions_copies.js')}}"></script>
{% endblock %}
