{% extends "admin/admin_base.html" %}

{% block title %}Add Editions | LMS{% endblock %}

{% block content %}

<!-- start page title -->
<div class="row">
    <div class="col-12">
        <div class="page-title-box">
            <div class="page-title-right">
                <ol class="breadcrumb m-0">
                    <li class="breadcrumb-item"><a href="javascript: void(0);">LMS</a></li>
                    <li class="breadcrumb-item"><a href="javascript: void(0);">Add</a></li>
                    <li class="breadcrumb-item active">Editions</li>
                </ol>
            </div>
            <h4 class="page-title">Registration book editions</h4>
        </div>
    </div>
</div>
<!-- end page title -->

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">


                <div class="alert alert-success" role="alert" id="succ_msg" style="display: none;">
                    A simple success alert—check it out!
                </div>
                <div class="alert alert-danger" role="alert" id="err_msg" style="display: none;">
                    A simple danger alert—check it out!
                </div>
                <form id="editionForm" novalidate>

                    <div class="alert alert-success" id="edition_succ_msg" style="display:none;"></div>
                    <div class="alert alert-danger" id="edition_error_msg" style="display:none;"></div>

                    <div class="row">

                        <!-- Book -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Book</label>
                                <select name="book_id" class="form-control">
                                    <option value="">Select Book</option>
                                    {% for book in books %}
                                    <option value="{{ book.book_id }}">{{ book.title }}</option>
                                    {% endfor %}
                                </select>
                                <div id="book_id_error" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Edition Number -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Edition Number</label>
                                <input type="text" name="edition_number" class="form-control"
                                    placeholder="Enter edition number">
                                <div id="edition_number_error" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Publisher -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Publisher</label>
                                <input type="text" name="publisher" class="form-control" placeholder="Publisher name">
                                <div id="publisher_error" class="invalid-feedback"></div>
                            </div>
                        </div>

                        <!-- Year -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Publication Year</label>
                                <input type="number" name="publication_year" class="form-control"
                                    placeholder="Publication year">
                                <div id="publication_year_error" class="invalid-feedback"></div>
                            </div>
                        </div>

                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-primary" onclick="add_edition()">
                            <span id="editionSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            <span id="editionBtnText">Add Edition</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="{{url_for('static', filename = 'js/librarian/register_books_editions_copies.js')}}"></script>
{% endblock %}
