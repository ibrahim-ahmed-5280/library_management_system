    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const htmlElement = document.querySelector('html');
        const toggleButton = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('dark-icon-indicator'); // Moon icon
        const lightIcon = document.getElementById('light-icon-indicator'); // Sun icon

        const STORAGE_KEY = 'userTheme';
        const LIGHT_CLASS = 'light-style';
        const DARK_CLASS = 'dark-style';
        const HIDE_CLASS = 'd-none'; // Bootstrap utility class for hiding

        // --- Core Functions ---

        function applyTheme(theme) {
          if (theme === 'dark') {
            // 1. Change body/html class to Dark Mode
            htmlElement.classList.remove(LIGHT_CLASS);
            htmlElement.classList.add(DARK_CLASS);

            // 2. Update icons: Hide Sun, Show Moon (The Moon icon suggests switching back to light)
            lightIcon.classList.add(HIDE_CLASS);
            darkIcon.classList.remove(HIDE_CLASS);

            // 3. Save preference
            localStorage.setItem(STORAGE_KEY, 'dark');

          } else { // 'light'
            // 1. Change body/html class to Light Mode
            htmlElement.classList.remove(DARK_CLASS);
            htmlElement.classList.add(LIGHT_CLASS);

            // 2. Update icons: Show Sun, Hide Moon (The Sun icon suggests switching back to dark)
            lightIcon.classList.remove(HIDE_CLASS);
            darkIcon.classList.add(HIDE_CLASS);

            // 3. Save preference
            localStorage.setItem(STORAGE_KEY, 'light');
          }
        }

        // 3. Handle the click event
        function toggleTheme() {
          // Check what the current theme is based on the HTML class
          const isDark = htmlElement.classList.contains(DARK_CLASS);

          // Toggle the theme
          const newTheme = isDark ? 'light' : 'dark';
          applyTheme(newTheme);
        }

        // --- Initialization ---

        // A. Check for saved preference in Local Storage
        const savedTheme = localStorage.getItem(STORAGE_KEY);

        // B. Apply saved theme on page load
        if (savedTheme) {
          applyTheme(savedTheme);
        } else {
          // Use the default theme set in the initial HTML or fall back to light.
          // If the HTML has 'dark-style' initially, treat it as dark, otherwise light.
          applyTheme(htmlElement.classList.contains(DARK_CLASS) ? 'dark' : 'light');
        }

        // C. Attach event listener to the toggle button
        if (toggleButton) {
          toggleButton.addEventListener('click', toggleTheme);
        }
      });
    </script>
